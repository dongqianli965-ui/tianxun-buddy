[project]
name = "tianxun-buddy-core"
version = "0.4.5.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "openpyxl>=3.1,<4.0",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
